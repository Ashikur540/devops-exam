version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_PASSWORD: notespass
    volumes:
      - ashik-notes-pgdata-swarm:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    image: ashikur1000/notes-api:v1
    environment:
      DATABASE_URL: postgresql://postgres:notespass@postgres:5432/notes
      PORT: 3000
      # C3 - S3 presigned URLs. Real key/secret come from docker/.env (gitignored,
      # never committed) via docker stack deploy's variable substitution.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ap-southeast-1
      S3_BUCKET: ashik-notes-attachments-750069566598
    ports:
      - "8400:3000"
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
        monitor: 15s
        max_failure_ratio: 0
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  ashik-notes-pgdata-swarm:
