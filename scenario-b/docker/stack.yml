version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_PASSWORD: notespass
    volumes:
      - ashik-notes-pgdata-swarm:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    image: ashikur1000/notes-api:v1
    environment:
      DATABASE_URL: postgresql://postgres:notespass@postgres:5432/notes
      PORT: 3000
    ports:
      - "8400:3000"
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  ashik-notes-pgdata-swarm:
