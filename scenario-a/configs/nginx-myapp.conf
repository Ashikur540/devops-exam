limit_req_zone $binary_remote_addr zone=ashik_api_limit:10m rate=5r/s;

upstream ashik_backends {
    server 127.0.0.1:3500 max_fails=1 fail_timeout=30s;
    server 127.0.0.1:3501 max_fails=1 fail_timeout=30s;
}

server {
    listen 8350;
    listen [::]:8350;
    server_name _;

    limit_req_status 429;

    location / {
        proxy_pass http://ashik_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /slow {
        proxy_next_upstream off;
        proxy_pass http://ashik_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 50s;
    }

    location /api/ {
        limit_req zone=ashik_api_limit burst=5 nodelay;
        proxy_pass http://ashik_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
