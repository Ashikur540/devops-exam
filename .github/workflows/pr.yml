# B5 Task 42 - trigger a second warm run to compare cache timing
name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notes
          POSTGRES_PASSWORD: notespass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scenario-b/app/package-lock.json

      - name: Install dependencies
        working-directory: scenario-b/app
        run: npm ci

      - name: Run unit tests
        working-directory: scenario-b/app
        run: npm test

      - name: Build Docker image
        working-directory: scenario-b/app
        run: docker build -t pr-test-image .

      - name: Start container and curl /healthz
        run: |
          set -e
          docker run -d --name pr-test --network host \
            -e DATABASE_URL=postgresql://postgres:notespass@localhost:5432/notes \
            -e PORT=3000 \
            pr-test-image
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs pr-test
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs pr-test || true

      - name: Cleanup
        if: always()
        run: docker rm -f pr-test || true
