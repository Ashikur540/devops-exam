# EXAM_TOKEN: ashik-devops-vmi3536696-1788500224-d4790b52
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'scenario-b/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write
  id-token: write # C2 Task 53 - needed so this workflow can get a short-lived
                  # OIDC token and assume an AWS role, instead of storing an
                  # AWS access key as a repo secret

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ashikur540/notes-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scenario-b/app/package-lock.json

      - name: Install dependencies
        working-directory: scenario-b/app
        run: npm ci

      - name: Run unit tests
        working-directory: scenario-b/app
        run: npm test

      - name: Log in to GHCR
        # GITHUB_TOKEN is minted fresh per run and expires when the job ends -
        # no long-lived static credential stored as a repo secret (B5 Task 43
        # hard rule).
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        working-directory: scenario-b/app
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:v1.0.${{ github.run_number }} \
            .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:v1.0.${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # B5 Task 44 - this environment has a required reviewer configured in
    # GitHub Settings, so the job pauses here for manual approval before it
    # touches the VPS.
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker service update --image ghcr.io/ashikur540/notes-api:${{ github.sha }} ashik_notes_app
            sleep 15
            docker service ps ashik_notes_app

  # C2 Task 53 - same push, also builds/pushes to ECR and rolls the image out
  # to the ECS Fargate service, via a short-lived OIDC role (no stored AWS keys).
  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        working-directory: scenario-b/app
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/ashik-notes-api:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/ashik-notes-api:${{ github.sha }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition ashik-notes-task \
            --query taskDefinition > task-definition.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-definition.clean.json

      - name: Render new image into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.clean.json
          container-name: app
          image: ${{ steps.login-ecr.outputs.registry }}/ashik-notes-api:${{ github.sha }}

      - name: Deploy new task definition revision to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ashik-notes-svc
          cluster: ashik-notes-cluster
          wait-for-service-stability: true
