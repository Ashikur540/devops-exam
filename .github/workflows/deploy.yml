name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'scenario-b/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ashikur540/notes-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scenario-b/app/package-lock.json

      - name: Install dependencies
        working-directory: scenario-b/app
        run: npm ci

      - name: Run unit tests
        working-directory: scenario-b/app
        run: npm test

      - name: Log in to GHCR
        # GITHUB_TOKEN is minted fresh per run and expires when the job ends -
        # no long-lived static credential stored as a repo secret (B5 Task 43
        # hard rule).
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        working-directory: scenario-b/app
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:v1.0.${{ github.run_number }} \
            .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:v1.0.${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # B5 Task 44 - this environment has a required reviewer configured in
    # GitHub Settings, so the job pauses here for manual approval before it
    # touches the VPS.
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # B5 Task 45 break #3 - deliberately wrong service name (deploy failure)
            docker service update --image ghcr.io/ashikur540/notes-api:${{ github.sha }} ashik_notes_app_TYPO
            sleep 15
            docker service ps ashik_notes_app_TYPO
